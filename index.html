<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrimonio - Iniciar sesión</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="header">
    <div class="header__contenedor">
      <p class="logo">PATRIMONIO</p>
    </div>
  </header>

  <main class="auth-layout">
    <div class="tarjeta-auth">
      <h1 class="tarjeta-auth__titulo">INICIAR SESIÓN</h1>
      <p class="tarjeta-auth__subtitulo">ADMINISTRÁ TUS FINANZAS DE FORMA SIMPLE</p>

      <form id="form-login" novalidate>

        <div class="campo">
          <label for="login-correo">CORREO ELECTRÓNICO</label>
          <input type="email" id="login-correo" name="correo" placeholder="INGRESA TU CORREO" required>
          <p class="campo__error oculto" id="login-correo-error" role="alert"></p>
        </div>

        <div class="campo">
          <label for="login-contrasena">CONTRASEÑA</label>
          <input type="password" id="login-contrasena" name="contrasena" placeholder="INGRESÁ TU CONTRASEÑA" required>
          <p class="campo__error oculto" id="login-contrasena-error" role="alert"></p>
        </div>

        <a href="recuperar-contrasena.html" class="enlace-derecha">¿OLVIDASTE TU CONTRASEÑA?</a>

        <button type="submit" class="btn btn--primario btn--block">INGRESAR</button>
      </form>

      <p class="auth-pie">
        ¿NO TENES CUENTA?
        <a href="crear-cuenta.html">CREAR CUENTA</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <p>Patrimonio · Proyecto final de Programación 4 · Universidad Champagnat</p>
  </footer>

  <script src="js/validacion.js" defer></script>
  <script src="js/login.js" defer></script>
</body>
</html>
