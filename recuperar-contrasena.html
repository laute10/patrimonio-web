<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrimonio - Recuperar contraseña</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="header">
    <div class="header__contenedor">
      <p class="logo">PATRIMONIO</p>
    </div>
  </header>

  <main class="auth-layout">
    <div class="tarjeta-auth">
      <h1 class="tarjeta-auth__titulo">RECUPERAR CONTRASEÑA</h1>
      <p class="tarjeta-auth__subtitulo">
        INGRESÁ TU CORREO Y TE ENVIAREMOS INSTRUCCIONES PARA RECUPERAR TU CONTRASEÑA
      </p>

      <form id="form-recuperar" novalidate>
        <p class="mensaje-exito oculto" id="recuperar-exito">
          TE ENVIAMOS LAS INSTRUCCIONES. REVISÁ TU CORREO.
        </p>

        <div class="campo" id="recuperar-campo">
          <label for="recuperar-correo">CORREO ELECTRÓNICO</label>
          <input type="email" id="recuperar-correo" name="correo" placeholder="INGRESÁ TU CORREO" required>
          <p class="campo__error oculto" id="recuperar-correo-error" role="alert"></p>
        </div>

        <button type="submit" class="btn btn--primario btn--block" id="recuperar-boton">ENVIAR INSTRUCCIONES</button>
      </form>

      <p class="auth-pie">
        <a href="index.html">VOLVÉ A INICIAR SESIÓN</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <p>Patrimonio · Proyecto final de Programación 4 · Universidad Champagnat</p>
  </footer>

  <script src="js/validacion.js" defer></script>
  <script src="js/recuperar-contrasena.js" defer></script>
</body>
</html>
